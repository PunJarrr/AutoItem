name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Compiles against paper-api 1.21, runs the unit and MockBukkit tests, builds the shaded jar.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoItem
          path: build/libs/AutoItem-*.jar
          if-no-files-found: error

  # On a version tag (v1.0.0), attach the jar to a draft GitHub release for Pun to review and publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoItem
      - run: rm -f AutoItem-*-plain.jar
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: AutoItem-*.jar
